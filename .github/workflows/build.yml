# CI — life-cycle gate G3 (ISO/IEC/IEEE 12207 verification).
# Builds and tests every microservice and serverless function in the reactor.
name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test all services and functions
        run: mvn -B verify
