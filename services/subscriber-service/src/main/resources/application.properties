# Subscriber Service — configuration is externalized (12-Factor III: Config).
# Every value below can be overridden with an environment variable, e.g.
# HTTP_PORT, LOG_LEVEL. No secrets live in this file: credentials are injected at
# runtime by the platform (12-Factor III + ISO/IEC 27001/27002 A.5.17).
quarkus.application.name=subscriber-service
quarkus.http.port=${HTTP_PORT:8081}
quarkus.http.root-path=/

# API contract (docs/api/api-standards.md): OpenAPI is generated from code and published.
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

# Observability (12-Factor XI: Logs as event streams; ISO/IEC 25010 maintainability).
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=false
quarkus.micrometer.binder-enabled-default-vertx=false
quarkus.micrometer.export.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Persistence: database-per-service (see docs/data/data-architecture.md).
# The default adapter is in-memory so the reference implementation runs anywhere;
# the production JPA adapter is selected with DB_KIND and injected credentials.
db.kind=${DB_KIND:in-memory}
db.url=${DB_URL:}
